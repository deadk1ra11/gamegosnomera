<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LinkUp — Социальная сеть</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0f12;
      --bg-card: #1a1a1f;
      --bg-elevated: #24242b;
      --border: #2e2e36;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --primary: #8b5cf6;
      --primary-hover: #7c3aed;
      --accent: #ec4899;
      --success: #22c55e;
      --danger: #ef4444;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea { font-family: inherit; }
    a { color: var(--primary); text-decoration: none; }
    .hidden { display: none !important; }
    .container { max-width: 640px; margin: 0 auto; padding: 0 16px; }

    /* Auth screens */
    #auth-screen {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: radial-gradient(ellipse at top, #1e1b4b 0%, var(--bg) 60%);
    }
    .auth-card {
      width: 100%;
      max-width: 400px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: var(--shadow);
    }
    .logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo h1 {
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(135deg, #a78bfa, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .logo p { color: var(--text-muted); font-size: 14px; margin-top: 4px; }
    .tabs {
      display: flex;
      background: var(--bg-elevated);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 24px;
    }
    .tab {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 500;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab.active {
      background: var(--primary);
      color: white;
    }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group textarea:focus {
      border-color: var(--primary);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px 20px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
    }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: var(--bg-elevated); color: var(--text); }
    .btn-sm { width: auto; padding: 8px 14px; font-size: 13px; border-radius: 8px; }
    .error-msg {
      background: rgba(239,68,68,0.15);
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .error-msg.show { display: block; }

    /* Main App */
    #app {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding-bottom: 70px;
    }
    header.app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15,15,18,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
    }
    .header-inner {
      max-width: 640px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-inner h1 {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, #a78bfa, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header-actions { display: flex; gap: 8px; align-items: center; }

    /* Bottom nav */
    nav.bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(26,26,31,0.95);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
      z-index: 100;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      cursor: pointer;
      padding: 6px 12px;
      transition: color 0.2s;
    }
    .nav-item.active { color: var(--primary); }
    .nav-item svg { width: 24px; height: 24px; }
    .badge {
      position: absolute;
      top: -2px;
      right: -6px;
      background: var(--accent);
      color: white;
      font-size: 10px;
      font-weight: 600;
      min-width: 16px;
      height: 16px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
    }
    .nav-item { position: relative; }

    /* Screens */
    .screen { display: none; padding: 16px 0 24px; }
    .screen.active { display: block; }

    /* Post card */
    .post-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
    }
    .post-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 16px;
      color: white;
      flex-shrink: 0;
      object-fit: cover;
      overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .post-author { font-weight: 600; font-size: 15px; }
    .post-meta { font-size: 12px; color: var(--text-muted); }
    .post-text {
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 12px;
    }
    .post-image {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 12px;
      max-height: 400px;
      object-fit: cover;
    }
    .post-actions {
      display: flex;
      gap: 16px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }
    .action-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      cursor: pointer;
      padding: 6px 0;
      transition: color 0.2s;
    }
    .action-btn:hover, .action-btn.liked { color: var(--accent); }
    .action-btn svg { width: 18px; height: 18px; }

    /* Create post */
    .create-post {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
    }
    .create-post textarea {
      width: 100%;
      min-height: 80px;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 15px;
      resize: none;
      outline: none;
      margin-bottom: 12px;
    }
    .create-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .file-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
    }
    .file-btn input { display: none; }

    /* Profile */
    .profile-header {
      text-align: center;
      padding: 24px 16px;
      background: var(--bg-card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .profile-avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 700;
      color: white;
      overflow: hidden;
    }
    .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .profile-name { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .profile-bio { color: var(--text-muted); font-size: 14px; margin-bottom: 16px; }
    .profile-stats {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-bottom: 16px;
    }
    .stat { text-align: center; }
    .stat-value { font-size: 18px; font-weight: 700; }
    .stat-label { font-size: 12px; color: var(--text-muted); }
    .profile-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

    /* Comments */
    .comments-section {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .comment {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    .comment-body { flex: 1; }
    .comment-author { font-weight: 600; font-size: 13px; }
    .comment-text { font-size: 14px; color: var(--text); }
    .comment-time { font-size: 11px; color: var(--text-muted); }
    .comment-form {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .comment-form input {
      flex: 1;
      padding: 10px 12px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    .comment-form button {
      background: var(--primary);
      border: none;
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Messages */
    .chat-list-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .chat-list-item:hover { background: var(--bg-elevated); }
    .chat-preview { flex: 1; min-width: 0; }
    .chat-name { font-weight: 600; font-size: 15px; }
    .chat-last { font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .chat-window {
      display: flex;
      flex-direction: column;
      height: calc(100dvh - 140px);
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      word-break: break-word;
    }
    .msg.mine {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--primary), #7c3aed);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .msg.theirs {
      align-self: flex-start;
      background: var(--bg-elevated);
      border-bottom-left-radius: 4px;
    }
    .msg-time { font-size: 10px; opacity: 0.7; margin-top: 4px; }
    .chat-input-bar {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: var(--bg-card);
    }
    .chat-input-bar input {
      flex: 1;
      padding: 12px 16px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 24px;
      color: var(--text);
      outline: none;
    }
    .chat-input-bar button {
      background: var(--primary);
      border: none;
      color: white;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
    }

    /* Notifications */
    .notif-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
    }
    .notif-item.unread { border-left: 3px solid var(--primary); }
    .notif-text { flex: 1; font-size: 14px; }
    .notif-time { font-size: 12px; color: var(--text-muted); }

    /* Empty states */
    .empty {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-muted);
    }
    .empty svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.5; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 16px;
    }
    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
    }
    .modal h3 { margin-bottom: 16px; font-size: 18px; }
    .modal-actions { display: flex; gap: 8px; margin-top: 20px; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 14px;
      z-index: 300;
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Loading */
    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-center {
      display: flex;
      justify-content: center;
      padding: 40px;
    }

    /* Search */
    .search-box {
      position: relative;
      margin-bottom: 16px;
    }
    .search-box input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 15px;
      outline: none;
    }
    .search-box svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      width: 18px;
      height: 18px;
    }

    /* User card */
    .user-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
    }
    .user-info { flex: 1; min-width: 0; }
    .user-name { font-weight: 600; font-size: 15px; }
    .user-bio { font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>
  <!-- Auth Screen -->
  <div id="auth-screen">
    <div class="auth-card">
      <div class="logo">
        <h1>LinkUp</h1>
        <p>Социальная сеть нового поколения</p>
      </div>
      <div class="tabs">
        <button class="tab active" data-tab="login">Вход</button>
        <button class="tab" data-tab="register">Регистрация</button>
      </div>
      <div id="auth-error" class="error-msg"></div>
      <form id="login-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" required placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label>Пароль</label>
          <input type="password" id="login-password" required placeholder="••••••••" autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" id="login-btn">Войти</button>
      </form>
      <form id="register-form" class="hidden">
        <div class="form-group">
          <label>Имя</label>
          <input type="text" id="reg-name" required placeholder="Как вас зовут?" maxlength="40">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="reg-email" required placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label>Пароль</label>
          <input type="password" id="reg-password" required placeholder="Минимум 6 символов" minlength="6" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary" id="reg-btn">Создать аккаунт</button>
      </form>
    </div>
  </div>

  <!-- Main App -->
  <div id="app" class="hidden">
    <header class="app-header">
      <div class="header-inner">
        <h1 id="header-title">LinkUp</h1>
        <div class="header-actions">
          <button class="btn btn-ghost btn-sm" id="btn-logout" title="Выйти">Выйти</button>
        </div>
      </div>
    </header>

    <main class="container">
      <!-- Feed -->
      <section id="screen-feed" class="screen active">
        <div class="create-post">
          <textarea id="post-text" placeholder="Что у вас нового?" maxlength="1000"></textarea>
          <div id="post-image-preview" class="hidden" style="margin-bottom:12px">
            <img id="preview-img" style="max-width:100%;border-radius:12px;max-height:220px;object-fit:cover;display:block">
            <button type="button" class="btn btn-ghost btn-sm" id="remove-post-image" style="margin-top:8px">Убрать фото</button>
          </div>
          <div class="create-actions">
            <label class="file-btn" style="cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--text-muted);font-size:13px">
              <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
              Фото
              <input type="file" id="post-image-file" accept="image/*" style="display:none">
            </label>
            <button class="btn btn-primary btn-sm" id="btn-publish" style="width:auto;padding:10px 20px">Опубликовать</button>
          </div>
        </div>
        <div id="feed-list"></div>
        <div id="feed-loading" class="loading-center"><div class="spinner"></div></div>
        <div id="feed-empty" class="empty hidden">
          <p>Пока нет публикаций.<br>Будьте первым!</p>
        </div>
      </section>

      <!-- Explore / Search -->
      <section id="screen-explore" class="screen">
        <div class="search-box">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" id="search-input" placeholder="Поиск пользователей...">
        </div>
        <div id="search-results"></div>
        <div id="explore-users"></div>
      </section>

      <!-- Messages -->
      <section id="screen-messages" class="screen">
        <div id="chats-list"></div>
        <div id="chat-view" class="hidden">
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
            <button class="btn btn-ghost btn-sm" id="btn-back-chats">← Назад</button>
            <span id="chat-with-name" style="font-weight:600"></span>
          </div>
          <div class="chat-window">
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input-bar">
              <input type="text" id="chat-input" placeholder="Сообщение..." maxlength="1000">
              <button id="btn-send-msg">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
              </button>
            </div>
          </div>
        </div>
        <div id="messages-empty" class="empty">
          <p>Нет диалогов.<br>Найдите человека в поиске и напишите ему.</p>
        </div>
      </section>

      <!-- Notifications -->
      <section id="screen-notifications" class="screen">
        <div id="notif-list"></div>
        <div id="notif-empty" class="empty hidden">
          <p>Нет уведомлений</p>
        </div>
      </section>

      <!-- Profile -->

  <div class="toast" id="toast"></div>

  <script type="module">
    // ========== Firebase ==========
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import {
      getDatabase, ref, set, get, push, update, remove, onValue, off, query, orderByChild, limitToLast, equalTo
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
    import {
      getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
      signOut, onAuthStateChanged, updateProfile
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC6K3mYILjj4AWkPE1mi_mQwDt43aCzynw",
      authDomain: "linkup-cdd9f.firebaseapp.com",
      databaseURL: "https://linkup-cdd9f-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "linkup-cdd9f",
      storageBucket: "linkup-cdd9f.firebasestorage.app",
      messagingSenderId: "332570322759",
      appId: "1:332570322759:web:f9a75a0a243c704fe58e62",
      measurementId: "G-G2RS95PVL3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    // ========== State ==========
    let currentUser = null;
    let currentUserData = null;
    let feedListener = null;
    let notifListener = null;
    let chatListener = null;
    let currentChatId = null;
    let currentChatPartner = null;
    let usersCache = {};

    // ========== Helpers ==========
    function $(sel) { return document.querySelector(sel); }
    function $$(sel) { return document.querySelectorAll(sel); }
    function showToast(msg, duration = 2500) {
      const t = $("#toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), duration);
    }
    function formatTime(ts) {
      if (!ts) return "";
      const d = new Date(ts);
      const now = new Date();
      const diff = (now - d) / 1000;
      if (diff < 60) return "только что";
      if (diff < 3600) return Math.floor(diff / 60) + " мин";
      if (diff < 86400) return Math.floor(diff / 3600) + " ч";
      if (diff < 604800) return Math.floor(diff / 86400) + " дн";
      return d.toLocaleDateString("ru-RU", { day: "numeric", month: "short" });
    }
    function escapeHtml(str) {
      if (!str) return "";
      return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }
    function isImageUrl(s) {
      if (!s || typeof s !== "string") return false;
      const t = s.trim();
      return /^https?:\/\//i.test(t) || t.startsWith("data:image/");
    }
    function avatarHtml(user, size = 42) {
      const photo = user?.photoURL || "";
      const emoji = user?.avatarEmoji || "";
      if (isImageUrl(photo)) {
        const fallback = escapeHtml(emoji || (user?.displayName || "?")[0] || "?");
        return `<div class="avatar" style="width:${size}px;height:${size}px"><img src="${escapeHtml(photo)}" alt="" onerror="this.parentElement.textContent='${fallback}'"></div>`;
      }
      if (emoji) {
        return `<div class="avatar" style="width:${size}px;height:${size}px;font-size:${Math.round(size * 0.55)}px;background:var(--bg-elevated)">${escapeHtml(emoji)}</div>`;
      }
      const letter = (user?.displayName || user?.email || "?")[0].toUpperCase();
      return `<div class="avatar" style="width:${size}px;height:${size}px">${letter}</div>`;
    }
    function getInitials(name) {
      return (name || "?")[0].toUpperCase();
    }
    function profileAvatarHtml(user, size = 96) {
      const photo = user?.photoURL || "";
      const emoji = user?.avatarEmoji || "";
      if (isImageUrl(photo)) {
        return `<div class="profile-avatar" style="width:${size}px;height:${size}px"><img src="${escapeHtml(photo)}" alt="" onerror="this.parentElement.textContent='${escapeHtml(emoji || getInitials(user?.displayName))}'"></div>`;
      }
      if (emoji) {
        return `<div class="profile-avatar" style="width:${size}px;height:${size}px;font-size:${Math.round(size * 0.5)}px;background:var(--bg-elevated)">${escapeHtml(emoji)}</div>`;
      }
      return `<div class="profile-avatar" style="width:${size}px;height:${size}px">${getInitials(user?.displayName)}</div>`;
    }

    const AVATAR_EMOJIS = ["😀","😎","🥳","🔥","💎","🚀","🎮","🐱","🐶","🦊","🐼","🐸","🦄","👽","🤖","👻","😈","💀","👑","⭐","❤️","💜","💙","🌟","⚡","🎯","🏆","🎨","🎵","📱"];

    // Сжатие фото → base64 (без Storage, как в игре)
    function compressImage(file, maxSide = 800, quality = 0.7) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type.startsWith("image/")) {
          reject(new Error("Не изображение"));
          return;
        }
        if (file.size > 12 * 1024 * 1024) {
          reject(new Error("Файл слишком большой (макс. 12 МБ)"));
          return;
        }
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(url);
          let w = img.width, h = img.height;
          if (w > maxSide || h > maxSide) {
            if (w > h) { h = Math.round(h * maxSide / w); w = maxSide; }
            else { w = Math.round(w * maxSide / h); h = maxSide; }
          }
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          let q = quality;
          let data = canvas.toDataURL("image/jpeg", q);
          // Ужимаем, если всё ещё тяжело для RTDB
          while (data.length > 350000 && q > 0.35) {
            q -= 0.1;
            data = canvas.toDataURL("image/jpeg", q);
          }
          if (data.length > 450000) {
            reject(new Error("Не удалось сжать фото. Выберите другое изображение."));
            return;
          }
          resolve(data);
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("Не удалось прочитать изображение"));
        };
        img.src = url;
      });
    }

    let pendingPostImage = null;   // base64 для поста
    let pendingAvatarImage = null; // base64 для аватара

    // ========== Auth UI ==========
    $$(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        $$(".tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        const isLogin = tab.dataset.tab === "login";
        $("#login-form").classList.toggle("hidden", !isLogin);
        $("#register-form").classList.toggle("hidden", isLogin);
        $("#auth-error").classList.remove("show");
      });
    });

    $("#login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = $("#login-email").value.trim();
      const password = $("#login-password").value;
      const btn = $("#login-btn");
      btn.disabled = true;
      btn.textContent = "Вход...";
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        showAuthError(mapAuthError(err));
      } finally {
        btn.disabled = false;
        btn.textContent = "Войти";
      }
    });

    $("#register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = $("#reg-name").value.trim();
      const email = $("#reg-email").value.trim();
      const password = $("#reg-password").value;
      if (name.length < 2) { showAuthError("Имя слишком короткое"); return; }
      const btn = $("#reg-btn");
      btn.disabled = true;
      btn.textContent = "Создание...";
      try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        await updateProfile(cred.user, { displayName: name });
        await set(ref(db, `users/${cred.user.uid}`), {
          uid: cred.user.uid,
          displayName: name,
          email: email,
          bio: "",
          photoURL: "",
          createdAt: Date.now(),
          followersCount: 0,
          followingCount: 0,
          postsCount: 0
        });
      } catch (err) {
        showAuthError(mapAuthError(err));
      } finally {
        btn.disabled = false;
        btn.textContent = "Создать аккаунт";
      }
    });

    function showAuthError(msg) {
      const el = $("#auth-error");
      el.textContent = msg;
      el.classList.add("show");
    }
    function mapAuthError(err) {
      const code = err.code || "";
      if (code.includes("email-already-in-use")) return "Этот email уже зарегистрирован";
      if (code.includes("invalid-email")) return "Некорректный email";
      if (code.includes("weak-password")) return "Пароль слишком слабый (минимум 6 символов)";
      if (code.includes("user-not-found") || code.includes("wrong-password") || code.includes("invalid-credential")) return "Неверный email или пароль";
      if (code.includes("too-many-requests")) return "Слишком много попыток. Подождите";
      return err.message || "Ошибка авторизации";
    }

    $("#btn-logout").addEventListener("click", async () => {
      await signOut(auth);
    });

    // ========== Auth State ==========
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        $("#auth-screen").classList.add("hidden");
        $("#app").classList.remove("hidden");
        await loadUserData(user.uid);
        initApp();
      } else {
        currentUser = null;
        currentUserData = null;
        cleanupListeners();
        $("#app").classList.add("hidden");
        $("#auth-screen").classList.remove("hidden");
      }
    });

    async function loadUserData(uid) {
      try {
        const snap = await get(ref(db, `users/${uid}`));
        if (snap.exists()) {
          currentUserData = snap.val();
        } else {
          // Create profile if missing
          currentUserData = {
            uid,
            displayName: currentUser.displayName || "Пользователь",
            email: currentUser.email || "",
            bio: "",
            photoURL: currentUser.photoURL || "",
            createdAt: Date.now(),
            followersCount: 0,
            followingCount: 0,
            postsCount: 0
          };
          await set(ref(db, `users/${uid}`), currentUserData);
        }
        usersCache[uid] = currentUserData;
      } catch (e) {
        console.error("loadUserData", e);
        showToast("Ошибка загрузки профиля. Проверьте правила Firebase.");
      }
    }

    function cleanupListeners() {
      if (feedListener) { off(feedListener); feedListener = null; }
      if (notifListener) { off(notifListener); notifListener = null; }
      if (chatListener) { off(chatListener); chatListener = null; }
    }

    // ========== Navigation ==========
    function initApp() {
      setupNav();
      loadFeed();
      loadNotifications();
      loadExploreUsers();
    }

    function setupNav() {
      $$(".nav-item").forEach(btn => {
        btn.addEventListener("click", () => {
          const screen = btn.dataset.screen;
          switchScreen(screen);
        });
      });
    }

    function switchScreen(name) {
      $$(".screen").forEach(s => s.classList.remove("active"));
      $$(".nav-item").forEach(n => n.classList.remove("active"));
      $(`#screen-${name}`)?.classList.add("active");
      $(`.nav-item[data-screen="${name}"]`)?.classList.add("active");

      const titles = { feed: "Лента", explore: "Поиск", messages: "Сообщения", notifications: "Уведомления", profile: "Профиль" };
      $("#header-title").textContent = titles[name] || "LinkUp";

      if (name === "profile") renderOwnProfile();
      if (name === "messages") {
        $("#chat-view").classList.add("hidden");
        $("#chats-list").classList.remove("hidden");
        loadChatsList();
      }
      if (name === "notifications") markNotificationsRead();
    }

    // ========== Feed ==========
    function loadFeed() {
      const list = $("#feed-list");
      const loading = $("#feed-loading");
      const empty = $("#feed-empty");
      loading.classList.remove("hidden");
      empty.classList.add("hidden");
      list.innerHTML = "";

      if (feedListener) off(feedListener);
      const postsRef = query(ref(db, "posts"), orderByChild("createdAt"), limitToLast(50));
      feedListener = postsRef;

      onValue(postsRef, async (snap) => {
        loading.classList.add("hidden");
        if (!snap.exists()) {
          empty.classList.remove("hidden");
          list.innerHTML = "";
          return;
        }
        empty.classList.add("hidden");
        const posts = [];
        snap.forEach(child => {
          posts.push({ id: child.key, ...child.val() });
        });
        posts.reverse();
        list.innerHTML = "";
        for (const post of posts) {
          const author = await getUser(post.authorId);
          list.appendChild(createPostCard(post, author));
        }
      }, (err) => {
        loading.classList.add("hidden");
        console.error("Feed error", err);
        list.innerHTML = `<div class="empty"><p>Ошибка загрузки ленты.<br>Проверьте правила безопасности Firebase (нужен доступ на чтение posts для авторизованных).</p></div>`;
      });
    }

    function createPostCard(post, author) {
      const div = document.createElement("div");
      div.className = "post-card";
      div.dataset.postId = post.id;

      const liked = post.likes && post.likes[currentUser.uid];
      const likesCount = post.likesCount || (post.likes ? Object.keys(post.likes).length : 0);
      const commentsCount = post.commentsCount || 0;

      div.innerHTML = `
        <div class="post-header">
          ${avatarHtml(author)}
          <div>
            <div class="post-author" data-uid="${post.authorId}" style="cursor:pointer">${escapeHtml(author?.displayName || "Пользователь")}</div>
            <div class="post-meta">${formatTime(post.createdAt)}</div>
          </div>
        </div>
        <div class="post-text">${escapeHtml(post.text)}</div>
        ${post.imageUrl ? `<img class="post-image" src="${escapeHtml(post.imageUrl)}" alt="" loading="lazy">` : ""}
        <div class="post-actions">
          <button class="action-btn ${liked ? "liked" : ""}" data-action="like">
            <svg fill="${liked ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
            <span class="like-count">${likesCount}</span>
          </button>
          <button class="action-btn" data-action="comment">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
            <span>${commentsCount}</span>
          </button>
          ${post.authorId === currentUser.uid ? `<button class="action-btn" data-action="delete" style="margin-left:auto;color:var(--danger)"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="18" height="18"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg></button>` : ""}
        </div>
        <div class="comments-section hidden" data-comments></div>
      `;

      div.querySelector('[data-action="like"]').addEventListener("click", () => toggleLike(post.id, liked));
      div.querySelector('[data-action="comment"]').addEventListener("click", () => toggleComments(div, post.id));
      const delBtn = div.querySelector('[data-action="delete"]');
      if (delBtn) delBtn.addEventListener("click", () => deletePost(post.id));
      div.querySelector(".post-author").addEventListener("click", () => viewUserProfile(post.authorId));

      return div;
    }

    async function getUser(uid) {
      if (usersCache[uid]) return usersCache[uid];
      try {
        const snap = await get(ref(db, `users/${uid}`));
        if (snap.exists()) {
          usersCache[uid] = snap.val();
          return usersCache[uid];
        }
      } catch (e) { console.warn(e); }
      return { displayName: "Пользователь", uid };
    }

    // ========== Create Post ==========
    $("#post-image-file")?.addEventListener("change", async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      try {
        showToast("Сжимаем фото...");
        pendingPostImage = await compressImage(file, 900, 0.72);
        $("#preview-img").src = pendingPostImage;
        $("#post-image-preview").classList.remove("hidden");
      } catch (err) {
        pendingPostImage = null;
        showToast(err.message || "Ошибка фото");
        e.target.value = "";
      }
    });
    $("#remove-post-image")?.addEventListener("click", () => {
      pendingPostImage = null;
      if ($("#post-image-file")) $("#post-image-file").value = "";
      $("#post-image-preview").classList.add("hidden");
      $("#preview-img").src = "";
    });

    $("#btn-publish").addEventListener("click", async () => {
      const text = $("#post-text").value.trim();
      if (!text && !pendingPostImage) {
        showToast("Напишите что-нибудь или добавьте фото");
        return;
      }
      const btn = $("#btn-publish");
      btn.disabled = true;
      btn.textContent = "Публикация...";
      try {
        const postRef = push(ref(db, "posts"));
        const postData = {
          authorId: currentUser.uid,
          text: text,
          imageUrl: pendingPostImage || "",
          createdAt: Date.now(),
          likesCount: 0,
          commentsCount: 0
        };
        await set(postRef, postData);
        const countRef = ref(db, `users/${currentUser.uid}/postsCount`);
        const countSnap = await get(countRef);
        await set(countRef, (countSnap.val() || 0) + 1);

        $("#post-text").value = "";
        pendingPostImage = null;
        if ($("#post-image-file")) $("#post-image-file").value = "";
        $("#post-image-preview").classList.add("hidden");
        $("#preview-img").src = "";
        showToast("Опубликовано!");
      } catch (e) {
        console.error(e);
        const msg = (e && e.message) || "";
        if (msg.includes("PERMISSION_DENIED") || msg.includes("permission")) {
          showToast("Ошибка: проверьте Security Rules для posts");
        } else if (msg.toLowerCase().includes("size") || msg.includes("too large")) {
          showToast("Фото слишком большое для базы. Выберите другое.");
        } else {
          showToast("Ошибка публикации. Проверьте правила Firebase.");
        }
      } finally {
        btn.disabled = false;
        btn.textContent = "Опубликовать";
      }
    });

    // ========== Like ==========
    async function toggleLike(postId, currentlyLiked) {
      const likeRef = ref(db, `posts/${postId}/likes/${currentUser.uid}`);
      const postRef = ref(db, `posts/${postId}`);
      try {
        if (currentlyLiked) {
          await remove(likeRef);
          const snap = await get(postRef);
          if (snap.exists()) {
            const count = Math.max(0, (snap.val().likesCount || 1) - 1);
            await update(postRef, { likesCount: count });
          }
        } else {
          await set(likeRef, true);
          const snap = await get(postRef);
          if (snap.exists()) {
            const count = (snap.val().likesCount || 0) + 1;
            await update(postRef, { likesCount: count });
          }
          // Notification
          const postSnap = await get(postRef);
          if (postSnap.exists() && postSnap.val().authorId !== currentUser.uid) {
            await createNotification(postSnap.val().authorId, {
              type: "like",
              fromUid: currentUser.uid,
              postId: postId,
              text: "лайкнул(а) вашу публикацию"
            });
          }
        }
      } catch (e) {
        console.error(e);
        showToast("Ошибка лайка");
      }
    }

    // ========== Comments ==========
    async function toggleComments(card, postId) {
      const section = card.querySelector("[data-comments]");
      if (!section.classList.contains("hidden")) {
        section.classList.add("hidden");
        return;
      }
      section.classList.remove("hidden");
      section.innerHTML = `<div class="loading-center"><div class="spinner"></div></div>`;

      const commentsRef = ref(db, `comments/${postId}`);
      onValue(commentsRef, async (snap) => {
        let html = "";
        if (snap.exists()) {
          const comments = [];
          snap.forEach(c => comments.push({ id: c.key, ...c.val() }));
          comments.sort((a, b) => a.createdAt - b.createdAt);
          for (const c of comments) {
            const author = await getUser(c.authorId);
            html += `
              <div class="comment">
                ${avatarHtml(author, 32)}
                <div class="comment-body">
                  <div class="comment-author">${escapeHtml(author?.displayName || "Пользователь")}</div>
                  <div class="comment-text">${escapeHtml(c.text)}</div>
                  <div class="comment-time">${formatTime(c.createdAt)}</div>
                </div>
              </div>`;
          }
        }
        html += `
          <div class="comment-form">
            <input type="text" placeholder="Написать комментарий..." maxlength="500">
            <button type="button">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
            </button>
          </div>`;
        section.innerHTML = html;

        const input = section.querySelector("input");
        const btn = section.querySelector("button");
        const send = async () => {
          const text = input.value.trim();
          if (!text) return;
          btn.disabled = true;
          try {
            const cRef = push(ref(db, `comments/${postId}`));
            await set(cRef, {
              authorId: currentUser.uid,
              text,
              createdAt: Date.now()
            });
            const pRef = ref(db, `posts/${postId}`);
            const pSnap = await get(pRef);
            if (pSnap.exists()) {
              await update(pRef, { commentsCount: (pSnap.val().commentsCount || 0) + 1 });
              if (pSnap.val().authorId !== currentUser.uid) {
                await createNotification(pSnap.val().authorId, {
                  type: "comment",
                  fromUid: currentUser.uid,
                  postId,
                  text: "прокомментировал(а) вашу публикацию"
                });
              }
            }
            input.value = "";
          } catch (e) {
            showToast("Ошибка комментария");
          } finally {
            btn.disabled = false;
          }
        };
        btn.addEventListener("click", send);
        input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
      }, (err) => {
        section.innerHTML = `<p style="color:var(--text-muted);font-size:13px">Не удалось загрузить комментарии</p>`;
      });
    }

    async function deletePost(postId) {
      if (!confirm("Удалить публикацию?")) return;
      try {
        await remove(ref(db, `posts/${postId}`));
        await remove(ref(db, `comments/${postId}`));
        const countRef = ref(db, `users/${currentUser.uid}/postsCount`);
        const snap = await get(countRef);
        await set(countRef, Math.max(0, (snap.val() || 1) - 1));
        showToast("Удалено");
      } catch (e) {
        showToast("Ошибка удаления");
      }
    }

    // ========== Notifications ==========
    async function createNotification(toUid, data) {
      if (toUid === currentUser.uid) return;
      try {
        const nRef = push(ref(db, `notifications/${toUid}`));
        await set(nRef, {
          ...data,
          createdAt: Date.now(),
          read: false
        });
      } catch (e) { console.warn("notif", e); }
    }

    function loadNotifications() {
      if (notifListener) off(notifListener);
      const nRef = query(ref(db, `notifications/${currentUser.uid}`), orderByChild("createdAt"), limitToLast(40));
      notifListener = nRef;
      onValue(nRef, async (snap) => {
        const list = $("#notif-list");
        const empty = $("#notif-empty");
        const badge = $("#notif-badge");
        if (!snap.exists()) {
          list.innerHTML = "";
          empty.classList.remove("hidden");
          badge.classList.add("hidden");
          return;
        }
        empty.classList.add("hidden");
        const notifs = [];
        let unread = 0;
        snap.forEach(c => {
          const n = { id: c.key, ...c.val() };
          notifs.push(n);
          if (!n.read) unread++;
        });
        notifs.reverse();
        if (unread > 0) {
          badge.textContent = unread > 99 ? "99+" : unread;
          badge.classList.remove("hidden");
        } else {
          badge.classList.add("hidden");
        }
        list.innerHTML = "";
        for (const n of notifs) {
          const from = await getUser(n.fromUid);
          const item = document.createElement("div");
          item.className = `notif-item ${n.read ? "" : "unread"}`;
          item.innerHTML = `
            ${avatarHtml(from, 40)}
            <div class="notif-text">
              <strong>${escapeHtml(from?.displayName || "Кто-то")}</strong> ${escapeHtml(n.text || "")}
              <div class="notif-time">${formatTime(n.createdAt)}</div>
            </div>`;
          list.appendChild(item);
        }
      }, (err) => {
        console.error("notif", err);
      });
    }

    async function markNotificationsRead() {
      try {
        const snap = await get(ref(db, `notifications/${currentUser.uid}`));
        if (!snap.exists()) return;
        const updates = {};
        snap.forEach(c => {
          if (!c.val().read) updates[`notifications/${currentUser.uid}/${c.key}/read`] = true;
        });
        if (Object.keys(updates).length) await update(ref(db), updates);
      } catch (e) { console.warn(e); }
    }

    // ========== Profile ==========
    function renderOwnProfile() {
      const content = $("#profile-content");
      const u = currentUserData || {};
      content.innerHTML = `
        <div class="profile-header">
          ${profileAvatarHtml(u, 96)}
          <div class="profile-name">${escapeHtml(u.displayName || "Пользователь")}</div>
          <div class="profile-bio">${escapeHtml(u.bio || "Нет описания")}</div>
          <div class="profile-stats">
            <div class="stat"><div class="stat-value">${u.postsCount || 0}</div><div class="stat-label">постов</div></div>
            <div class="stat"><div class="stat-value">${u.followersCount || 0}</div><div class="stat-label">подписчиков</div></div>
            <div class="stat"><div class="stat-value">${u.followingCount || 0}</div><div class="stat-label">подписок</div></div>
          </div>
          <div class="profile-actions">
            <button class="btn btn-primary btn-sm" id="btn-edit-profile">Редактировать</button>
          </div>
        </div>`;
      $("#btn-edit-profile")?.addEventListener("click", openEditProfile);
      loadUserPosts(currentUser.uid, $("#profile-posts"));
    }

    async function viewUserProfile(uid) {
      if (uid === currentUser.uid) {
        switchScreen("profile");
        return;
      }
      switchScreen("profile");
      const content = $("#profile-content");
      content.innerHTML = `<div class="loading-center"><div class="spinner"></div></div>`;
      const user = await getUser(uid);
      let isFollowing = false;
      try {
        const fSnap = await get(ref(db, `follows/${currentUser.uid}/${uid}`));
        isFollowing = fSnap.exists();
      } catch (e) {}

      content.innerHTML = `
        <div class="profile-header">
          ${profileAvatarHtml(user, 96)}
          <div class="profile-name">${escapeHtml(user.displayName || "Пользователь")}</div>
          <div class="profile-bio">${escapeHtml(user.bio || "Нет описания")}</div>
          <div class="profile-stats">
            <div class="stat"><div class="stat-value">${user.postsCount || 0}</div><div class="stat-label">постов</div></div>
            <div class="stat"><div class="stat-value">${user.followersCount || 0}</div><div class="stat-label">подписчиков</div></div>
            <div class="stat"><div class="stat-value">${user.followingCount || 0}</div><div class="stat-label">подписок</div></div>
          </div>
          <div class="profile-actions">
            <button class="btn ${isFollowing ? "btn-ghost" : "btn-primary"} btn-sm" id="btn-follow">${isFollowing ? "Отписаться" : "Подписаться"}</button>
            <button class="btn btn-ghost btn-sm" id="btn-message">Написать</button>
          </div>
        </div>`;
      $("#btn-follow")?.addEventListener("click", () => toggleFollow(uid, isFollowing));
      $("#btn-message")?.addEventListener("click", () => openChatWith(uid));
      loadUserPosts(uid, $("#profile-posts"));
    }

    async function loadUserPosts(uid, container) {
      container.innerHTML = `<div class="loading-center"><div class="spinner"></div></div>`;
      try {
        const snap = await get(query(ref(db, "posts"), orderByChild("authorId"), equalTo(uid)));
        if (!snap.exists()) {
          container.innerHTML = `<div class="empty"><p>Нет публикаций</p></div>`;
          return;
        }
        const posts = [];
        snap.forEach(c => posts.push({ id: c.key, ...c.val() }));
        posts.sort((a, b) => b.createdAt - a.createdAt);
        const author = await getUser(uid);
        container.innerHTML = "";
        posts.forEach(p => container.appendChild(createPostCard(p, author)));
      } catch (e) {
        container.innerHTML = `<div class="empty"><p>Ошибка загрузки постов</p></div>`;
      }
    }

    function openEditProfile() {
      const u = currentUserData || {};
      pendingAvatarImage = null;
      $("#edit-name").value = u.displayName || "";
      $("#edit-bio").value = u.bio || "";
      $("#edit-emoji").value = u.avatarEmoji || "";
      if ($("#edit-photo-file")) $("#edit-photo-file").value = "";
      const prev = $("#edit-avatar-preview");
      const img = $("#edit-avatar-img");
      if (isImageUrl(u.photoURL)) {
        img.src = u.photoURL;
        prev.style.display = "flex";
        $("#clear-avatar-photo")?.classList.remove("hidden");
      } else {
        img.src = "";
        prev.style.display = "none";
        $("#clear-avatar-photo")?.classList.add("hidden");
      }
      const picker = $("#emoji-picker");
      picker.innerHTML = AVATAR_EMOJIS.map(e =>
        `<button type="button" class="emoji-btn" data-emoji="${e}" style="width:40px;height:40px;font-size:22px;border:1px solid var(--border);border-radius:10px;background:var(--bg-elevated);cursor:pointer">${e}</button>`
      ).join("");
      picker.querySelectorAll(".emoji-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          $("#edit-emoji").value = btn.dataset.emoji;
          pendingAvatarImage = null;
          if ($("#edit-photo-file")) $("#edit-photo-file").value = "";
          img.src = "";
          prev.style.display = "none";
          $("#clear-avatar-photo")?.classList.add("hidden");
        });
      });
      $("#edit-modal").classList.remove("hidden");
    }

    $("#edit-photo-file")?.addEventListener("change", async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      try {
        showToast("Сжимаем аватар...");
        pendingAvatarImage = await compressImage(file, 320, 0.75);
        $("#edit-avatar-img").src = pendingAvatarImage;
        $("#edit-avatar-preview").style.display = "flex";
        $("#clear-avatar-photo")?.classList.remove("hidden");
        $("#edit-emoji").value = "";
      } catch (err) {
        pendingAvatarImage = null;
        showToast(err.message || "Ошибка фото");
        e.target.value = "";
      }
    });
    $("#clear-avatar-photo")?.addEventListener("click", () => {
      pendingAvatarImage = "";
      if ($("#edit-photo-file")) $("#edit-photo-file").value = "";
      $("#edit-avatar-img").src = "";
      $("#edit-avatar-preview").style.display = "none";
      $("#clear-avatar-photo")?.classList.add("hidden");
    });

    $("#btn-cancel-edit").addEventListener("click", () => {
      pendingAvatarImage = null;
      $("#edit-modal").classList.add("hidden");
    });
    $("#btn-save-profile").addEventListener("click", async () => {
      const name = $("#edit-name").value.trim();
      const bio = $("#edit-bio").value.trim();
      const emoji = ($("#edit-emoji").value || "").trim();
      if (name.length < 2) { showToast("Имя слишком короткое"); return; }

      let photo = currentUserData?.photoURL || "";
      if (pendingAvatarImage === "") {
        photo = ""; // явно убрали
      } else if (pendingAvatarImage) {
        photo = pendingAvatarImage; // новый base64
      }
      // если выбрали эмодзи и не грузили фото — фото не трогаем, только если очистили
      if (emoji && pendingAvatarImage === null && !isImageUrl(photo)) {
        // ok
      }
      if (emoji && pendingAvatarImage === null && isImageUrl(photo) && pendingAvatarImage !== "") {
        // оставляем старое фото, эмодзи тоже можно
      }

      try {
        const payload = {
          displayName: name,
          bio,
          avatarEmoji: emoji || ""
        };
        if (pendingAvatarImage === "" || pendingAvatarImage) {
          payload.photoURL = photo;
        }
        await update(ref(db, `users/${currentUser.uid}`), payload);
        try {
          await updateProfile(currentUser, {
            displayName: name,
            photoURL: isImageUrl(photo) && photo.startsWith("http") ? photo : null
          });
        } catch (_) {}
        currentUserData = {
          ...currentUserData,
          displayName: name,
          bio,
          avatarEmoji: emoji || "",
          photoURL: (pendingAvatarImage === "" || pendingAvatarImage) ? photo : (currentUserData.photoURL || "")
        };
        if (pendingAvatarImage === "" || pendingAvatarImage) {
          currentUserData.photoURL = photo;
        }
        usersCache[currentUser.uid] = currentUserData;
        pendingAvatarImage = null;
        $("#edit-modal").classList.add("hidden");
        renderOwnProfile();
        showToast("Профиль обновлён");
      } catch (e) {
        console.error(e);
        showToast("Ошибка сохранения. Возможно, фото слишком большое для базы.");
      }
    });

    // ========== Follow ==========
    async function toggleFollow(targetUid, currentlyFollowing) {
      try {
        if (currentlyFollowing) {
          await remove(ref(db, `follows/${currentUser.uid}/${targetUid}`));
          await remove(ref(db, `followers/${targetUid}/${currentUser.uid}`));
          // decrement counts
          await adjustCount(`users/${currentUser.uid}/followingCount`, -1);
          await adjustCount(`users/${targetUid}/followersCount`, -1);
          showToast("Вы отписались");
        } else {
          await set(ref(db, `follows/${currentUser.uid}/${targetUid}`), true);
          await set(ref(db, `followers/${targetUid}/${currentUser.uid}`), true);
          await adjustCount(`users/${currentUser.uid}/followingCount`, 1);
          await adjustCount(`users/${targetUid}/followersCount`, 1);
          await createNotification(targetUid, {
            type: "follow",
            fromUid: currentUser.uid,
            text: "подписался(ась) на вас"
          });
          showToast("Вы подписались");
        }
        viewUserProfile(targetUid);
      } catch (e) {
        console.error(e);
        showToast("Ошибка подписки");
      }
    }

    async function adjustCount(path, delta) {
      const r = ref(db, path);
      const snap = await get(r);
      await set(r, Math.max(0, (snap.val() || 0) + delta));
    }

    // ========== Explore / Search ==========
    async function loadExploreUsers() {
      const container = $("#explore-users");
      try {
        const snap = await get(ref(db, "users"));
        if (!snap.exists()) {
          container.innerHTML = `<div class="empty"><p>Пока никого нет</p></div>`;
          return;
        }
        let html = `<h3 style="font-size:14px;color:var(--text-muted);margin-bottom:12px">Пользователи</h3>`;
        const users = [];
        snap.forEach(c => {
          if (c.key !== currentUser.uid) users.push({ uid: c.key, ...c.val() });
        });
        users.slice(0, 20).forEach(u => {
          usersCache[u.uid] = u;
          html += userCardHtml(u);
        });
        container.innerHTML = html || `<div class="empty"><p>Нет других пользователей</p></div>`;
        container.querySelectorAll("[data-view-user]").forEach(el => {
          el.addEventListener("click", () => viewUserProfile(el.dataset.viewUser));
        });
        container.querySelectorAll("[data-msg-user]").forEach(el => {
          el.addEventListener("click", () => openChatWith(el.dataset.msgUser));
        });
      } catch (e) {
        container.innerHTML = `<div class="empty"><p>Ошибка загрузки. Нужен доступ на чтение /users</p></div>`;
      }
    }

    function userCardHtml(u) {
      return `
        <div class="user-card">
          ${avatarHtml(u, 44)}
          <div class="user-info">
            <div class="user-name">${escapeHtml(u.displayName || "Пользователь")}</div>
            <div class="user-bio">${escapeHtml(u.bio || u.email || "")}</div>
          </div>
          <button class="btn btn-ghost btn-sm" data-view-user="${u.uid}">Профиль</button>
          <button class="btn btn-primary btn-sm" data-msg-user="${u.uid}">Написать</button>
        </div>`;
    }

    let searchTimeout;
    $("#search-input").addEventListener("input", (e) => {
      clearTimeout(searchTimeout);
      const q = e.target.value.trim().toLowerCase();
      searchTimeout = setTimeout(() => {
        if (!q) {
          $("#search-results").innerHTML = "";
          return;
        }
        const results = Object.values(usersCache).filter(u =>
          u.uid !== currentUser.uid &&
          ((u.displayName || "").toLowerCase().includes(q) || (u.email || "").toLowerCase().includes(q))
        );
        let html = "";
        results.forEach(u => { html += userCardHtml(u); });
        $("#search-results").innerHTML = html || `<div class="empty"><p>Ничего не найдено</p></div>`;
        $("#search-results").querySelectorAll("[data-view-user]").forEach(el => {
          el.addEventListener("click", () => viewUserProfile(el.dataset.viewUser));
        });
        $("#search-results").querySelectorAll("[data-msg-user]").forEach(el => {
          el.addEventListener("click", () => openChatWith(el.dataset.msgUser));
        });
      }, 300);
    });

    // ========== Messages ==========
    function getChatId(uid1, uid2) {
      return [uid1, uid2].sort().join("_");
    }

    async function openChatWith(partnerUid) {
      currentChatPartner = partnerUid;
      currentChatId = getChatId(currentUser.uid, partnerUid);
      switchScreen("messages");
      $("#chats-list").classList.add("hidden");
      $("#messages-empty").classList.add("hidden");
      $("#chat-view").classList.remove("hidden");
      const partner = await getUser(partnerUid);
      $("#chat-with-name").textContent = partner.displayName || "Чат";

      // Ensure chat metadata
      await set(ref(db, `userChats/${currentUser.uid}/${currentChatId}`), {
        partnerId: partnerUid,
        updatedAt: Date.now()
      });
      await set(ref(db, `userChats/${partnerUid}/${currentChatId}`), {
        partnerId: currentUser.uid,
        updatedAt: Date.now()
      });

      loadChatMessages(currentChatId);
    }

    function loadChatMessages(chatId) {
      if (chatListener) off(chatListener);
      const msgRef = query(ref(db, `chats/${chatId}/messages`), orderByChild("createdAt"), limitToLast(100));
      chatListener = msgRef;
      const container = $("#chat-messages");
      onValue(msgRef, (snap) => {
        container.innerHTML = "";
        if (!snap.exists()) {
          container.innerHTML = `<div class="empty" style="padding:24px"><p>Начните диалог</p></div>`;
          return;
        }
        snap.forEach(c => {
          const m = c.val();
          const mine = m.senderId === currentUser.uid;
          const div = document.createElement("div");
          div.className = `msg ${mine ? "mine" : "theirs"}`;
          div.innerHTML = `${escapeHtml(m.text)}<div class="msg-time">${formatTime(m.createdAt)}</div>`;
          container.appendChild(div);
        });
        container.scrollTop = container.scrollHeight;
      }, (err) => {
        container.innerHTML = `<div class="empty"><p>Ошибка загрузки сообщений</p></div>`;
      });
    }

    $("#btn-send-msg").addEventListener("click", sendMessage);
    $("#chat-input").addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });

    async function sendMessage() {
      const text = $("#chat-input").value.trim();
      if (!text || !currentChatId) return;
      try {
        const mRef = push(ref(db, `chats/${currentChatId}/messages`));
        await set(mRef, {
          senderId: currentUser.uid,
          text,
          createdAt: Date.now()
        });
        await update(ref(db, `userChats/${currentUser.uid}/${currentChatId}`), { updatedAt: Date.now(), lastMessage: text });
        await update(ref(db, `userChats/${currentChatPartner}/${currentChatId}`), { updatedAt: Date.now(), lastMessage: text });
        $("#chat-input").value = "";
      } catch (e) {
        showToast("Не удалось отправить");
      }
    }

    $("#btn-back-chats").addEventListener("click", () => {
      if (chatListener) { off(chatListener); chatListener = null; }
      currentChatId = null;
      currentChatPartner = null;
      $("#chat-view").classList.add("hidden");
      $("#chats-list").classList.remove("hidden");
      loadChatsList();
    });

    async function loadChatsList() {
      const list = $("#chats-list");
      const empty = $("#messages-empty");
      try {
        const snap = await get(ref(db, `userChats/${currentUser.uid}`));
        if (!snap.exists()) {
          list.innerHTML = "";
          empty.classList.remove("hidden");
          return;
        }
        empty.classList.add("hidden");
        const chats = [];
        snap.forEach(c => chats.push({ id: c.key, ...c.val() }));
        chats.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
        list.innerHTML = "";
        for (const ch of chats) {
          const partner = await getUser(ch.partnerId);
          const item = document.createElement("div");
          item.className = "chat-list-item";
          item.innerHTML = `
            ${avatarHtml(partner, 48)}
            <div class="chat-preview">
              <div class="chat-name">${escapeHtml(partner.displayName || "Пользователь")}</div>
              <div class="chat-last">${escapeHtml(ch.lastMessage || "Нет сообщений")}</div>
            </div>`;
          item.addEventListener("click", () => openChatWith(ch.partnerId));
          list.appendChild(item);
        }
      } catch (e) {
        list.innerHTML = `<div class="empty"><p>Ошибка загрузки чатов</p></div>`;
      }
    }

    // Close modal on overlay click
    $("#edit-modal").addEventListener("click", (e) => {
      if (e.target === $("#edit-modal")) $("#edit-modal").classList.add("hidden");
    });
  </script>
</body>
</html>
